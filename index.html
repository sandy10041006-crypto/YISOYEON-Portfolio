const navItems=[['ABOUT','about'],['WORK','work'],['CASES','cases'],['PROCESS','process'],['WHY MICE','why-mice'],['CONTACT','contact']];
const icon={
  arrowRight:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  arrowDown:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>`,
  x:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  menu:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>`,
  alert:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>`,
  mail:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 5L2 7"/></svg>`
};
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;'}[m]));}
function label(n,t){return `<div class="section-label"><span>${n}</span><b>${t}</b></div>`;}
function render(){
 const c=CONTENT;
 document.getElementById('root').innerHTML=`
 <div class="site-shell">
  <header class="site-nav"><a class="brand" href="#about"><span>LS</span><div>${esc(c.profile.brand)}<small>MICE PORTFOLIO</small></div></a><nav>${navItems.map(([l,id])=>`<button data-go="${id}">${l}</button>`).join('')}</nav><button class="menu-button" id="menuBtn" aria-label="메뉴">${icon.menu}</button></header>
  <div class="mobile-menu" id="mobileMenu">${navItems.map(([l,id])=>`<button data-go="${id}">${l}${icon.arrowRight}</button>`).join('')}</div>
  <main>
   <section id="about" class="hero-section"><div class="hero-copy"><p class="eyebrow">${c.profile.eyebrow}</p><h1>${esc(c.profile.headline[0])}<br><em>${esc(c.profile.headline[1])}</em>${esc(c.profile.headline[2])}<br>${esc(c.profile.headline[3])}</h1><p class="hero-intro">${esc(c.profile.intro)}</p><div class="hero-meta"><span>${esc(c.profile.name)}</span><span>${esc(c.profile.role)}</span><span>${esc(c.profile.period)}</span></div></div><div class="hero-mark"><div class="hero-grid"></div><div class="hero-big">MICE</div><p>PLAN THE EXPERIENCE.<br>CONNECT THE PEOPLE.<br>DELIVER THE RESULT.</p></div><a class="scroll-cue" href="#competencies">${icon.arrowDown} SCROLL TO EXPLORE</a></section>
   <section id="competencies" class="content-section">${label('01','CORE COMPETENCIES')}<div class="section-heading"><h2>선언이 아니라,<br><span>실제 경험</span>으로 증명합니다.</h2><p>제가 잘한다고 말하는 대신, 실제 프로젝트에서 어떤 흐름으로 업무를 수행했는지 보여드립니다.</p></div><div class="competency-grid">${c.competencies.map(x=>`<div><span class="number">${x.number}</span><h3>${x.eng}</h3><h4>${x.title}</h4><p>${x.desc}</p><b>${x.evidence}</b></div>`).join('')}</div></section>
   <section id="work" class="dark-section">${label('02','EXPERIENCE / SELECTED PROJECTS')}<div class="dark-heading"><h2>전시회 리스트보다,<br><span>프로젝트의 흐름</span>을 보여드립니다.</h2><p>다양한 국가·산업군의 해외 전시 업무를 수행했습니다. 각 전시회마다 실제 담당 범위를 기준으로 모집, 운영, 홍보, 주최사 커뮤니케이션, 현장 지원 경험을 쌓았습니다.</p></div><div class="exhibition-list">${Object.entries(c.exhibitions).map(([g,l])=>`<div><h3>${g}</h3><div>${l.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`).join('')}</div><div class="work-footnote">전시회별 담당 범위는 프로젝트에 따라 달랐으며, 확인된 업무만 포트폴리오에 반영했습니다.</div></section>
   <section id="cases" class="content-section">${label('03','CASE STUDIES')}<div class="section-heading"><h2>문제에서 결과까지,<br><span>제가 움직인 장면</span>들입니다.</h2><p>카드를 클릭하면 Problem → Role → Approach → Action → Result → Learning의 전체 흐름을 확인할 수 있습니다.</p></div><div class="case-list">${c.cases.map(x=>`<article class="case-card" data-case="${x.no}" role="button" tabindex="0"><div class="case-card-top"><span class="case-no">CASE ${x.no}</span><span class="case-label">${esc(x.label)}</span>${icon.arrowRight}</div><h3>${esc(x.title)}</h3><p>${esc(x.subtitle)}</p><div class="tag-row">${x.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></article>`).join('')}</div></section>
   <section id="process" class="process-section">${label('04','HOW I WORK')}<div class="section-heading"><h2>계획을 만드는 사람에 머무르지 않고,<br><span>계획이 현장에서 작동할 때까지</span> 움직입니다.</h2></div><div class="process-grid">${c.process.map(x=>`<div><span>${x[0]}</span><h3>${x[1]}</h3><h4>${x[2]}</h4><p>${x[3]}</p></div>`).join('')}</div></section>
   <section id="why-mice" class="why-section">${label('05','WHY MICE / WHY THIS ROLE')}<div class="why-flow"><div><small>MY EXPERIENCE</small><strong>해외 전시회</strong></div>${icon.arrowRight}<div><small>WHAT I LEARNED</small><strong>행사는 사람·정보·일정·현장을 연결하는 프로젝트</strong></div>${icon.arrowRight}<div><small>TRANSFERABLE SKILLS</small><strong>모집 · 조율 · 홍보 · 현장 운영 · 문제 해결 · 결과 정리</strong></div>${icon.arrowRight}<div class="highlight"><small>NEXT STEP</small><strong>전시회 중심의 경험을 컨퍼런스·세미나·산업행사까지 확장</strong></div></div><div class="why-statement"><p>${esc(c.why.statement)}</p><b>${esc(c.why.closing)}</b></div></section>
   <section id="contact" class="contact-section"><div><p class="eyebrow">READY TO CONNECT</p><h2>사람과 정보를 연결해<br><em>하나의 행사</em>를 완성하겠습니다.</h2><p>한국풍력산업협회의 회원사, 산업 관계자, 정부·유관기관, 해외 파트너, 연사, 참가자가 만나는 MICE 현장에서 실무로 기여하겠습니다.</p></div><div class="contact-card"><span>${esc(c.profile.contactRole)}</span>${c.profile.email?`<a href="mailto:${esc(c.profile.email)}">${icon.mail} ${esc(c.profile.email)}</a>`:''}${c.profile.linkedin?`<a href="${esc(c.profile.linkedin)}" target="_blank" rel="noreferrer">LinkedIn ↗</a>`:''}</div><div class="contact-footer"><span>LEE SO-YEON</span><span>PLAN THE EXPERIENCE. CONNECT THE PEOPLE. DELIVER THE RESULT.</span></div></section>
  </main><div id="modalRoot"></div>
 </div>`;
 bind();
}
function openCase(item){document.body.style.overflow='hidden'; document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="case-modal" onclick="event.stopPropagation()"><div class="modal-header"><span>CASE ${item.no} · ${esc(item.label)}</span><button id="closeModal" aria-label="닫기">${icon.x}</button></div><div class="modal-body"><div class="modal-kicker">PROJECT CASE STUDY</div><h2>${esc(item.title)}</h2><p class="modal-subtitle">${esc(item.subtitle)}</p><div class="modal-section"><h4>${icon.alert} PROBLEM</h4><p>${esc(item.problem)}</p></div><div class="modal-section"><h4>${icon.check} ROLE · 내가 한 일</h4><div class="role-grid">${item.role.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div><div class="modal-section"><h4>APPROACH · 실행 흐름</h4><div class="approach-list">${item.approach.map((x,i)=>`<span><b>${String(i+1).padStart(2,'0')}</b>${esc(x)}</span>`).join('')}</div></div><div class="modal-section"><h4>RESULT · 확인된 결과</h4><div class="result-callout">${esc(item.result)}</div></div><div class="modal-section"><h4>LEARNING</h4><blockquote>“${esc(item.learning)}”</blockquote></div></div><div class="modal-footer"><button id="closeModal2">닫기</button></div></div></div>`; document.getElementById('modalBackdrop').onclick=closeModal; document.getElementById('closeModal').onclick=closeModal; document.getElementById('closeModal2').onclick=closeModal;}
function closeModal(){document.body.style.overflow='';document.getElementById('modalRoot').innerHTML='';}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.go)?.scrollIntoView({behavior:'smooth'});document.getElementById('mobileMenu').classList.remove('open');}));
 const mb=document.getElementById('menuBtn'); mb.addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('open'));
 document.querySelectorAll('.case-card').forEach(card=>{const item=CONTENT.cases.find(x=>x.no===card.dataset.case); card.addEventListener('click',()=>openCase(item));card.addEventListener('keydown',e=>{if(e.key==='Enter')openCase(item)});});
 const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.site-nav nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===e.target.id));}}),{rootMargin:'-20% 0px -65%'}); navItems.forEach(([,id])=>{const el=document.getElementById(id);if(el)obs.observe(el);});
 window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalRoot').innerHTML)closeModal();});
}
render();
</script>
</body>
